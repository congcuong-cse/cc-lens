stages:
  - lint-and-build
  - ai
  - publish

claude:
  stage: ai
  tags:
    - claude
  # Adjust rules to fit how you want to trigger the job:
  # - manual runs
  # - merge request events
  # - web/API triggers when a comment contains '@claude'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_STRATEGY: fetch
  script:
    # Optional: start a GitLab MCP server if your setup provides one
    - /bin/gitlab-mcp-server || true
    # Use AI_FLOW_* variables when invoking via web/API triggers with context payloads
    - echo "$AI_FLOW_INPUT"
    - >
      claude
      -p "${AI_FLOW_INPUT:-'Review this MR (branch: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME). Apply safe fixes by committing them to that branch via the gitlab push_files tool, then post one MR comment summarizing the review and what you changed.'}"
      --permission-mode acceptEdits
      --allowedTools "Bash Read Edit Write mcp__gitlab"
      --debug

default:
  image: node:20
  tags:
    - ci
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

lint-and-build:
  stage: lint-and-build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run build

publish:
  stage: publish
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm ci --cache .npm --prefer-offline
    - npm pkg set name="@${CI_PROJECT_ROOT_NAMESPACE}/cc-lens"
    - |
      {
        echo "@${CI_PROJECT_ROOT_NAMESPACE}:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "${CI_API_V4_URL#https:}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=\${CI_JOB_TOKEN}"
      } > .npmrc
    - npm publish
